<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Header</title>
  <link rel="stylesheet" href="styleslin.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
  --heading-color:  #f39c12 !important;
}
body {
    background: url(assers/fon.jpg);
}
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #ddd;
    }
    .nav-link {
    transition: color 0.3s;
}
.nav-link:hover {
    color: #f39c12 !important;
}
.nav-menu > a:hover {
    border-bottom: 2px solid #f39c12;
}
.dropdown-item:hover {
    /* background-color: #f1f1f1; */
    color: #f39c12 !important;
      }
    .full-width-line {
      display: none;
      width: 100%;
      height: 2px;
      background-color: gray;
      margin: 10px 0;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-menu .line {
      border-left: 2px solid gray;
      height: 1.5em;
    }

    .search-container {
      width: 300px;
    }

    .search-container input {
      width: 100%;
    }

    .submenu {
      display: none;
      position: absolute;
      background-color: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 10px;
      list-style: none;
    }

    .dropdown:hover .submenu {
      display: block;
    }
    /* Стандартний вигляд */
.card-show {
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 1rem;
    padding: 1rem;
}

.card-inhalt {
    display: flex;
    align-items: center;
}

.avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin-right: 1rem;
}

.card-info {
    flex-grow: 1;
}

.card-title {
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.card-stern {
    display: flex;
    align-items: center;
}

.card-data {
    margin-left: 0.5rem;
    font-size: 0.9rem;
    color: gray;
}

.card-body {
    margin-top: 1rem;
}

/* Адаптивний вигляд для малих екранів */
@media (max-width: 576px) {
    .card-show {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .card-inhalt {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .avatar {
        margin-bottom: 1rem;
        margin-right: 0;
    }

    .card-info {
        text-align: left;
        margin-bottom: 1rem;
        width: 100%;
    }

    .card-title,
    .card-stern {
        margin: 0;
        text-align: left;
    }

    .card-stern {
        justify-content: flex-start;
        margin-top: 0.5rem;
    }

    .card-body {
        text-align: left;
        width: 100%;
    }

    .text-content {
        margin: 0;
    }
}
    @media (max-width: 768px) {
      header {
        display: block; 
        padding: 0;
      }
      .navbar-brand {
        display: block;
        text-align: center;
      }

      .nav-menu {
        display: block;
        text-align: center;
      }

      .nav-menu a {
        display: block;
        margin: 10px 0;
      }
      .nav-menu > a:hover {
    border-bottom: none;
      }
      .nav-menu .line {
       display: none;
      }
      .full-width-line {
        display: block;
      }

      .search-container {
        width: 100%; 
        margin-top: 10px;
      }

      .search-container input {
        width: 100%;
      }

      .submenu {
        position: static; 
        display: none;
        text-align: center;
      }

      .dropdown:hover .submenu {
        display: block;
      }
      input.form-control {
        padding: 0;
        height: 50px;
      }
    }
  </style>
</head>
<body class="bg-light">

<header>
  <a href="#" class="navbar-brand">
    <img src="./assers/logo.jpg" alt="Logo" width="59" class="img-fluid">
  </a>
  <div class="full-width-line"></div>

  <nav class="nav-menu">
    <a href="#home" class="nav-link text-dark text-decoration-none fs-5">Home</a>
    <div class="line"></div>
    <div class="full-width-line"></div>
    <div class="dropdown">
      <a href="#karten" class="nav-link text-dark text-decoration-none fs-5">Karten</a>
      <ul class="submenu text-start">
        <li><a href="#menu-de" class="dropdown-item">MENU | DE</a></li>
        <li><a href="#menu-eng" class="dropdown-item">MENU | ENG</a></li>
      </ul>
    </div>
    <div class="line"></div>
    <div class="full-width-line"></div>
    <a href="#kontakt" class="nav-link text-dark text-decoration-none fs-5">Kontakt</a>
  </nav>

  <div class="search-container">
    <div class="position-relative">
      <input type="search" class="form-control" placeholder="Search">
      <img src="./assers/search.svg" alt="Search Icon" 
           class="position-absolute top-50 end-0 translate-middle-y me-3">
    </div>
  </div>
</header>
<section id="user" class="userSection d-flex row mt-3">
  <div class="card-show">
      <div class="card-inhalt d-flex align-items-center">
          <img src="./assers/mulatka.jpg" class="avatar">
          <div class="card-info">
              <div class="card-title">Manuele Piastra</div>
              <div class="card-stern text-warning">★ ★ ★ ★ ★<span class="card-data">1 tag züruck</span></div>
          </div>
      </div>
      <div class="card-body">
          <p class="text-content">Super Steak House nur zum Empfehlen!</p>
      </div>
  </div>
  <div class="card-show">
      <div class="card-inhalt d-flex align-items-center">
          <img src="./assers/brile.jpg" class="avatar">
          <div class="card-info">
              <div class="card-title">Michael Koch</div>
              <div class="card-stern text-warning">★ ★ ★ ★ ★<span class="card-data">10 tag züruck</span></div>
          </div>
      </div>
      <div class="card-body">
          <p class="text-content">Ich entschied mich für den Beef Burger und wurde nicht enttäuscht. Das Ambiente ist angenehm. Insgesamt sehr empfehlenswert.</p>
      </div>
  </div>
</section>
